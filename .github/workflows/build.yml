
name: Build Apple TV IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Prepare EON credentials
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          url = "https://raw.githubusercontent.com/nirvana-7777/pvr.eon/Omega/src/Globals.h"
          source = urllib.request.urlopen(url).read().decode()
          pairs = re.findall(
              r'"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"\s*,\s*"([^"]+)"',
              source
          )

          if len(pairs) < 2:
              raise SystemExit("Could not find EON client credentials")

          web_id, web_secret = pairs[0]
          android_id, android_secret = pairs[1]

          with open("EON_TV/App/Secrets.swift", "w") as f:
              f.write(
                  "enum Secrets {\n"
                  f'  static let androidTVClientID = "{android_id}"\n'
                  f'  static let androidTVClientSecret = "{android_secret}"\n'
                  f'  static let webClientID = "{web_id}"\n'
                  f'  static let webClientSecret = "{web_secret}"\n'
                  "}\n"
              )
          PY

      - name: Build for Apple TV
        run: |
          set -o pipefail
          xcodebuild \
            -project EON_TV.xcodeproj \
            -scheme EON_TV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify

      - name: Package IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-appletvos/EON_TV.app"
          test -d "$APP"
          mkdir -p build/IPA/Payload
          cp -R "$APP" build/IPA/Payload/
          cd build/IPA
          zip -r ../EON-TV-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EON-TV-unsigned-IPA
          path: build/EON-TV-unsigned.ipa
          if-no-files-found: error
